<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cap PFMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Carnet de route : chaque démarche est un tampon. Mobile d'abord : un écran par onglet + barre du bas ; PC : rail à gauche, liste + détail. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#E4E8F0; --ink:#13213A; --muted:#58657D; --line:#D3DAE5;
  --accent:#2B50E8; --accent-ink:#FFFFFF; --accent-soft:#E3E9FD;
  --stamp:#B8306F; --stamp-soft:#F8E4EE;
  --ok:#17804F; --ok-soft:#DFF2E8; --warn:#A66200; --warn-soft:#FBEFD9; --danger:#C22F2F; --danger-soft:#FBE3E3;
  --f-display:"Unbounded","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(19,33,58,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#161E2E; --surface-2:#1F293C; --ink:#E6EBF5; --muted:#9AA6BD; --line:#2A3550;
  --accent:#8AA2FF; --accent-ink:#0D1320; --accent-soft:#1F2A4F;
  --stamp:#F07AB0; --stamp-soft:#3A1D2D;
  --ok:#58D29A; --ok-soft:#14332A; --warn:#F1B45C; --warn-soft:#3A2A12; --danger:#FF8075; --danger-soft:#3D1C1C;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#161E2E; --surface-2:#1F293C; --ink:#E6EBF5; --muted:#9AA6BD; --line:#2A3550;
  --accent:#8AA2FF; --accent-ink:#0D1320; --accent-soft:#1F2A4F;
  --stamp:#F07AB0; --stamp-soft:#3A1D2D;
  --ok:#58D29A; --ok-soft:#14332A; --warn:#F1B45C; --warn-soft:#3A2A12; --danger:#FF8075; --danger-soft:#3D1C1C;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
body.dys{letter-spacing:.03em;word-spacing:.12em;line-height:1.75}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);font-style:normal;font-size:.7rem;transform:rotate(-12deg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:700;color:var(--muted);text-align:left;position:relative}
.nav button svg{width:22px;height:22px;flex:0 0 auto}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav .dot{position:absolute;top:7px;left:28px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 4px;font-weight:700}
.rail .foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:10px}

.main{min-width:0;overflow:auto;padding:24px 28px 120px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.35rem,3.4vw,1.9rem);letter-spacing:-.015em;line-height:1.15}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:-.005em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h2 small{font-family:var(--f-body);font-weight:400;font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hint{font-size:.86rem;color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-height:44px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.88rem;font-weight:700;color:var(--muted);min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.78rem;margin-left:4px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st-cible{background:var(--surface-2);color:var(--muted)}
.st-attente{background:var(--accent-soft);color:var(--accent)}
.st-entretien{background:var(--warn-soft);color:var(--warn)}
.st-refus{background:var(--danger-soft);color:var(--danger)}
.st-accepte{background:var(--ok-soft);color:var(--ok)}
.due{background:var(--danger);color:#fff}
.soon{background:var(--warn-soft);color:var(--warn)}
.fit{background:var(--ok-soft);color:var(--ok)}
.nofit{background:var(--surface-2);color:var(--muted)}

/* Accueil */
.hero{background:var(--ink);color:var(--surface);border-radius:20px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,4vw,1.8rem);line-height:1.15}
.hero p{margin:6px 0 0;opacity:.85}
.hero .count{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;text-align:right}
.hero .count small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;opacity:.8}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:0 0 auto}
.ring b{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem;text-align:center;line-height:1.1}
.ring b small{display:block;font-family:var(--f-body);font-size:.66rem;font-weight:400;color:var(--muted)}
.todo{display:flex;flex-direction:column;gap:8px}
.todo .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:left}
.todo .it b{display:block}
.todo .it .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);font-size:1.1rem}
.todo .it.late{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:var(--danger-soft)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.stampb{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.74rem;color:var(--muted)}
.stampb .s{width:70px;height:70px;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.66rem;line-height:1.15;color:var(--line);padding:6px;transform:rotate(-8deg);text-transform:uppercase}
.stampb.on .s{border:3px solid var(--stamp);color:var(--stamp);background:var(--stamp-soft);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--stamp)}
.stampb.on{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}

/* Entreprises */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.clist{display:flex;flex-direction:column;gap:8px}
.ccard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.ccard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ccard .t{font-weight:700;font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .m{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.ex{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--warn)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.detail{display:flex;flex-direction:column;gap:16px}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.actions button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-size:.82rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px}
.actions button span{font-size:1.25rem}
.actions button:hover{border-color:var(--accent)}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.tl .ev{position:relative;padding:6px 0 12px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.tl .ev.refus::before{border-color:var(--danger)}.tl .ev.accepte::before{border-color:var(--ok);background:var(--ok)}
.tl .ev .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.tl .ev .x{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:.9rem;float:right}
.refgrid{display:flex;flex-direction:column;gap:6px}
.refgrid label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:.92rem}
.refgrid input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:0 0 auto}
.proof{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--stamp-soft)}
.proof img{width:110px;height:56px;object-fit:contain;background:#fff;border-radius:8px}

/* Préparer */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.script{background:var(--bg);border-radius:12px;padding:14px 16px;white-space:pre-wrap;line-height:1.65;border-left:4px solid var(--accent)}
.script .var{background:var(--accent-soft);border-radius:4px;padding:0 3px;font-weight:700}
.script .miss{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px;font-weight:700}
.obj{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.obj summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.obj summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
.obj[open] summary::after{content:"−"}
.obj .b{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--ok);flex:0 0 auto}
.check label small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.check label:has(input:checked){background:var(--ok-soft)}

/* Simulateur */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.scen button b{font-size:1.02rem}
.scen .best{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.45}
.bub.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.bub.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;align-self:flex-end}
.bub .who{display:block;font-size:.72rem;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.fb{align-self:stretch;font-size:.9rem;padding:8px 12px;border-radius:10px}
.fb.s2{background:var(--ok-soft)}.fb.s1{background:var(--warn-soft)}.fb.s0{background:var(--danger-soft)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;line-height:1.4}
.choices button:hover{border-color:var(--accent)}

/* Signature */
.sigpad{width:100%;height:180px;border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block}

.bnav{display:none}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:.92rem;box-shadow:var(--shadow);z-index:300;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(8,12,22,.55);z-index:200;display:grid;place-items:end center;padding:0}
.mbox{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:620px;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.mbox h3{font-family:var(--f-display);font-weight:600;font-size:1.1rem}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:700px){.modal{place-items:center;padding:16px}.mbox{border-radius:20px}}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--warn-soft);font-size:.9rem;flex-wrap:wrap}
.banner b{flex:1;min-width:min(100%,220px)}
a.btn{text-decoration:none}
.code{font-family:var(--f-mono);font-size:.72rem;word-break:break-all;background:var(--bg);border-radius:10px;padding:10px;max-height:120px;overflow:auto}
.onb{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.onb .big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.1;letter-spacing:-.02em}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.88rem}
.steps3 b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--stamp)}

@media (min-width:1100px){ .split.has{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)} }
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .main{padding:18px 16px 40px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:transparent;padding:8px 2px 7px;font-size:.7rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  .bnav button svg{width:24px;height:24px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav .dot{position:absolute;top:3px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:.64rem;display:grid;place-items:center;padding:0 4px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .count{text-align:left}
  .steps3{grid-template-columns:minmax(0,1fr)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){ .actions{grid-template-columns:repeat(2,minmax(0,1fr))} }
.dir-list{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding-right:4px}
.dir-inline{display:flex;flex-direction:column;gap:8px}
.dir-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);align-items:center}
.dir-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.dir-card .t{font-weight:700;font-size:.98rem}
.dir-card .sub{font-size:.82rem;color:var(--muted);line-height:1.4}
.ac-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.ac-item{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.82rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac-item:hover{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="app">
  <aside class="rail">
    <div class="logo"><i>PFMP</i>Cap PFMP</div>
    <nav class="nav" id="rail"></nav>
    <div class="foot" id="railfoot"></div>
  </aside>
  <main class="main" id="main"></main>
  <nav class="bnav" id="bnav"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileIn" accept=".json,application/json,.txt,text/plain" hidden>

<script>
(function(){
"use strict";
/* ================= utilitaires ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

function acceptedFor(n){return S.companies.find(c=>cStatus(c)==="accepte"&&cPer(c)===n)}
function curPeriod(){for(let n=1;n<=nP();n++)if(!acceptedFor(n))return n;return 1}
const pfmp=n=>per(n||curPeriod());
const pLab=n=>nP()===2?"période "+n:"PFMP";
function weeks(n){const {start,end}=pfmp(n);if(!start||!end)return 0;return Math.max(1,Math.round((diffD(end,start)+3)/7))}
function cStatus(c){const ev=c.events;if(!ev.length)return "cible";if(ev.some(e=>e.type==="accepte"))return "accepte";const last=ev[ev.length-1];if(last.type==="refus")return "refus";if(ev.some(e=>e.type==="entretien"))return "entretien";return "attente"}
function sortEv(c){c.events.sort((a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0))}
function fit(c){return c.refs.filter(r=>D().acts.some(a=>a[0]===r)).length}
function points(){let p=0;S.companies.forEach(c=>c.events.forEach(e=>{p+=(EV[e.type]||{pts:0}).pts}));S.companies.forEach(c=>{if(c.proof)p+=2});return p}
function allEvents(){const a=[];S.companies.forEach(c=>c.events.forEach(e=>a.push(Object.assign({c},e))));return a}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function weekActions(){const ws=weekStart();return allEvents().filter(e=>e.date>=ws&&e.date<=today()).length}
function tasks(){const t=today(),out=[];S.companies.forEach(c=>{const st=cStatus(c);if((st==="attente"||st==="entretien")&&c.next&&c.next.date){out.push({c,date:c.next.date,label:c.next.label,late:c.next.date<t,now:c.next.date===t})}});return out.sort((a,b)=>a.date.localeCompare(b.date))}

  const found=[1,2].slice(0,np).map(n=>acceptedFor(n)),allFound=found.every(Boolean),acc=allFound;
  const tp=allFound?([1,2].slice(0,np).find(n=>per(n).start&&per(n).start>=today())||np):cur,start=per(tp).start;
  const days=start?diffD(start,today()):null;
  const counts={};S.companies.forEach(c=>{const s=cStatus(c);counts[s]=(counts[s]||0)+1});
  const late=tk.filter(t=>t.late||t.now),soon=tk.filter(t=>!t.late&&!t.now).slice(0,3);
  const todos=[];
  late.forEach(t=>todos.push(`<button class="it late" data-open="${t.c.id}"><span class="ic">🔁</span><span><b>${esc(t.label)} · ${esc(t.c.nom)}</b><span class="hint">${t.late?"En retard depuis "+fd(t.date):"Aujourd'hui"}</span></span><span class="pill due">${t.late?"En retard":"Aujourd'hui"}</span></button>`));
  soon.forEach(t=>todos.push(`<button class="it" data-open="${t.c.id}"><span class="ic">🗓️</span><span><b>${esc(t.label)} · ${esc(t.c.nom)}</b><span class="hint">${fd(t.date)}</span></span><span class="pill soon">Bientôt</span></button>`));
  todos.push(`<button class="it" id="homeOpenDir"><span class="ic">🏫</span><span><b>Annuaire Vente du lycée (${ANNUAIRE_VENTE.length} entreprises)</b><span class="hint">Immobilier, Auto, Assurance, Banque… Ajoute-les en 1 clic</span></span><span class="pill st-attente">Voir la liste</span></button>`);
  if(!acc&&S.companies.length<S.config.objectif)todos.push(`<button class="it" data-go="shops"><span class="ic">➕</span><span><b>Ajoute des entreprises à ta liste</b><span class="hint">${S.companies.length} sur ${S.config.objectif} visées</span></span><span class="pill st-attente">${S.config.objectif-S.companies.length} à trouver</span></button>`);
  const toContact=S.companies.filter(c=>cStatus(c)==="cible");
  if(!acc&&toContact.length)todos.push(`<button class="it" data-open="${toContact[0].id}"><span class="ic">🚶</span><span><b>Contacte ${esc(toContact[0].nom)}</b><span class="hint">${toContact.length} entreprise(s) pas encore contactée(s)</span></span><span class="pill st-cible">À faire</span></button>`);
  found.forEach((fc,i)=>{if(!fc)return;const n=i+1,cv=S.conventions[n].checks;const nDone=CONV.filter(x=>cv[x[0]]).length;todos.unshift(`<button class="it" data-go="me"><span class="ic">📝</span><span><b>Termine ta convention${np===2?" (période "+n+")":""}</b><span class="hint">${esc(fc.nom)} · ${nDone} étape(s) sur ${CONV.length}</span></span><span class="pill st-accepte">${nDone===CONV.length?"Fini":"En cours"}</span></button>`)});
  $("#main").innerHTML=`<div class="wrap">
    ${S.example?`<div class="banner"><b>Ceci est un exemple : rien n'est à toi.</b><button class="btn sm" id="clearDemo">Commencer pour de vrai</button></div>`:""}
    <section class="hero">
      <div><span class="eyebrow" style="color:inherit;opacity:.7">Salut ${esc(p.prenom)}</span>
        <h1>${allFound?(np===2?"Tes 2 PFMP sont trouvées !":`PFMP trouvée chez ${esc(found[0].nom)} !`):found.some(Boolean)?`Période ${found.findIndex(Boolean)+1} trouvée ! Cherche maintenant la période ${cur}`:late.length?`${late.length} relance${late.length>1?"s":""} à faire aujourd'hui`:S.companies.length?"Continue sur ta lancée":"Commence par lister 5 entreprises"}</h1>
        <p>${start?(days>0?`Ta ${pLab(tp)} commence dans ${days} jour${days>1?"s":""} (${fdl(start)}).`:days===0?`Ta ${pLab(tp)} commence aujourd'hui !`:`Ta ${pLab(tp)} a commencé.`) :`Ajoute les dates de ta ${pLab(tp)} dans « Moi ».`}</p>
        ${np===2?`<p style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${[1,2].map(n=>`<span class="pill" style="background:rgba(255,255,255,.14);color:inherit">Période ${n}${per(n).start?" · "+fd(per(n).start):""} : ${found[n-1]?esc(found[n-1].nom):"à trouver"}</span>`).join("")}</p>`:""}</div>
      <div class="count">${points()}<small>points de démarches</small></div>
    </section>
    <div class="grid2">
      <section class="panel"><h2>À faire <small>${todos.length?"":"rien d'urgent"}</small></h2><div class="todo">${todos.join("")||'<p class="hint" style="margin:0">Tout est à jour. Profites-en pour t\'entraîner ou préparer ta prochaine visite.</p>'}</div></section>
      <section class="panel"><h2>Cette semaine</h2>
        <div class="row" style="gap:16px;flex-wrap:nowrap"><div class="ring" style="--p:${Math.min(100,wa/h*100)}"><b>${wa}/${h}<small>démarches</small></b></div>
        <p class="hint" style="margin:0">${wa>=h?"Objectif atteint, bravo. Chaque démarche compte, même un refus.":`Encore ${h-wa} démarche${h-wa>1?"s":""} pour atteindre ton objectif. Un dépôt, un appel ou une relance comptent.`}</p></div>
        <div class="stats">
          <div class="stat"><b class="num">${S.companies.length}</b><span>ciblées</span></div>
          <div class="stat"><b class="num">${(counts.attente||0)+(counts.entretien||0)}</b><span>en cours</span></div>
          <div class="stat"><b class="num">${counts.refus||0}</b><span>refus</span></div>
          <div class="stat"><b class="num">${counts.accepte||0}</b><span>accord</span></div>
        </div>
      </section>
    </div>
    <section class="panel"><h2>Mes tampons <small>${BADGES.filter(b=>b[3]()).length} / ${BADGES.length}</small></h2>
      <div class="stamps">${BADGES.map(([k,t,desc,ok])=>{const on=ok();return `<div class="stampb ${on?"on":""}"><div class="s">${esc(t)}</div><span>${esc(typeof desc==="function"?desc():desc)}</span></div>`}).join("")}</div>
    </section>
  </div>`;
  const cd=$("#clearDemo");cd&&(cd.onclick=()=>{S=blank();save();render()});
  const hod=$("#homeOpenDir");hod&&(hod.onclick=()=>{ui.shopMode="annuaire";go("shops")});
  $("#main").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ui.sel=b.dataset.open;go("shops")});
}

const dirState={cat:"Toutes",city:"Toutes",q:"",limit:60};

function isInMyList(p){
  const nn=norm(p.nom),nv=norm(p.ville);
  return S.companies.some(c=>norm(c.nom)===nn&&(!nv||norm(c.ville)===nv));
}
function addFromAnnuaire(p,silent){
  const dup=S.companies.find(c=>norm(c.nom)===norm(p.nom)&&norm(c.ville)===norm(p.ville));
  if(dup){if(!silent)toast(p.nom+" est déjà dans ta liste.");return dup}
  const adrFull=[p.adresse,p.cp].filter(Boolean).join(" ");
  const c={id:uid(),periode:curPeriod(),nom:p.nom,type:p.type||"Autre",ville:p.ville||"",adresse:adrFull,tel:p.tel||"",email:"",contact:"",trajet:"",source:"Réseau du lycée",refs:[],avis:"",notes:p.cat?"Spécialité Vente · "+p.cat:"",events:[],next:null,created:Date.now()};
  S.companies.push(c);save();
  if(!silent)toast("✓ "+p.nom+" ajoutée à ta liste d'entreprises !");
  return c;
}
function buildDirBlock(inModal){
  const myVille=norm(P().ville||"");
  const cats=["Toutes",...new Set(ANNUAIRE_VENTE.map(x=>x.cat))];
  const cityCounts={};ANNUAIRE_VENTE.forEach(x=>{if(x.ville)cityCounts[x.ville]=(cityCounts[x.ville]||0)+1});
  const topCities=Object.entries(cityCounts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
  if(P().ville){const match=Object.keys(cityCounts).find(v=>norm(v)===myVille);if(match&&!topCities.includes(match))topCities.unshift(match)}
  const qn=norm(dirState.q);
  let res=ANNUAIRE_VENTE.filter(x=>(dirState.cat==="Toutes"||x.cat===dirState.cat)&&(dirState.city==="Toutes"||x.ville===dirState.city)&&(!qn||norm(x.nom+" "+x.ville+" "+x.adresse+" "+x.cp+" "+x.cat).includes(qn)));
  res.sort((a,b)=>{
    const am=myVille&&norm(a.ville)===myVille?0:1,bm=myVille&&norm(b.ville)===myVille?0:1;
    return (am-bm)||a.ville.localeCompare(b.ville)||a.nom.localeCompare(b.nom);
  });
  const shown=res.slice(0,dirState.limit);
  return `<div class="panel" style="gap:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><span class="eyebrow">Spécialité Vente (Bac Pro MCV option B)</span><h2>🏫 Annuaire des entreprises partenaires (${ANNUAIRE_VENTE.length})</h2>
      <p class="hint" style="margin:2px 0 0">Entreprises ayant déjà accueilli nos stagiaires en Vente. Clique sur <b>+ Cibler</b> pour ajouter une entreprise à ton carnet avec son adresse et son téléphone.</p></div>
      ${inModal?`<button type="button" class="btn ghost sm" data-close-dir>Fermer</button>`:""}
    </div>
    <input class="inp" id="dir-q" type="search" placeholder="🔍 Rechercher une enseigne (ex. Orpi, AXA, Peugeot), une ville, une rue ou un code postal…" value="${esc(dirState.q)}">
    <div class="fld"><span class="lab">Filtrer par secteur Vente</span><div class="chips" id="dir-cats">${cats.map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${c===dirState.cat}">${esc(c)}</button>`).join("")}</div></div>
    <div class="fld"><span class="lab">Filtrer par ville</span><div class="chips" id="dir-cities"><button type="button" class="chip" data-v="Toutes" aria-pressed="${dirState.city==="Toutes"}">Toutes les villes<span class="n">${ANNUAIRE_VENTE.length}</span></button>${topCities.map(v=>`<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${v===dirState.city}">${esc(v)}<span class="n">${cityCounts[v]}</span></button>`).join("")}</div></div>
    <div class="row" style="justify-content:space-between"><span class="hint"><b>${res.length}</b> entreprise${res.length>1?"s":""} trouvée${res.length>1?"s":""}${dirState.city!=="Toutes"?" à "+esc(dirState.city):""}${dirState.cat!=="Toutes"?" · "+esc(dirState.cat):""}</span>
      ${dirState.cat!=="Toutes"||dirState.city!=="Toutes"||dirState.q?`<button type="button" class="btn ghost sm" id="dir-reset">Réinitialiser les filtres</button>`:""}
    </div>
    <div class="${inModal?"dir-list":"dir-inline"}" id="dir-list">
      ${shown.map((x,i)=>{
        const added=isInMyList(x);
        return `<div class="dir-card"><div><div class="t">${esc(x.nom)} <span class="pill st-cible" style="font-size:.72rem">${esc(x.cat)}</span></div>
          <div class="sub">📍 ${esc([x.adresse,x.cp,x.ville].filter(Boolean).join(" · "))}${x.tel?` · 📞 <span class="num">${esc(x.tel)}</span>`:""}</div></div>
          <button type="button" class="btn sm ${added?"soft":""}" data-dir-add="${i}" ${added?"disabled":""}>${added?"✓ Dans ma liste":"+ Cibler"}</button></div>`;
      }).join("")||`<div class="empty">Aucune entreprise ne correspond à cette recherche.</div>`}
    </div>
    ${res.length>dirState.limit?`<button type="button" class="btn soft sm" id="dir-more" style="align-self:center">Afficher plus d'entreprises (${res.length-dirState.limit} restantes)</button>`:""}
  </div>`;
}

  let res=ANNUAIRE_VENTE.filter(x=>(dirState.cat==="Toutes"||x.cat===dirState.cat)&&(dirState.city==="Toutes"||x.ville===dirState.city)&&(!qn||norm(x.nom+" "+x.ville+" "+x.adresse+" "+x.cp+" "+x.cat).includes(qn)));
  res.sort((a,b)=>{
    const am=myVille&&norm(a.ville)===myVille?0:1,bm=myVille&&norm(b.ville)===myVille?0:1;

  const dr=root.querySelector("#dir-reset");
  dr&&(dr.onclick=()=>{dirState.cat="Toutes";dirState.city="Toutes";dirState.q="";dirState.limit=60;refreshFn()});
  const dm=root.querySelector("#dir-more");
  dm&&(dm.onclick=()=>{dirState.limit+=80;refreshFn()});
  root.querySelectorAll("[data-dir-add]").forEach(b=>b.onclick=()=>{
    const p=res[+b.dataset.dirAdd];

    if(!S.profile)S.profile={prenom:"Élève",nom:"",diplome:"MCVB",classe:"",lycee:"",ville:"",trajet:45,periodes:1,pfmpStart:"",pfmpEnd:"",pfmp2Start:"",pfmp2End:""};

function eventForm(c,type){const e=EV[type];

    <div class="acts"><button class="btn ghost" data-x>Annuler</button><button class="btn" data-ok>Enregistrer</button></div>`,close=>{

    let drawing=false,inked=false,last=null;const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};

      const out=document.createElement("canvas");out.width=360;out.height=Math.round(360*cv.height/cv.width);const o=out.getContext("2d");o.fillStyle="#fff";o.fillRect(0,0,out.width,out.height);o.drawImage(cv,0,0,out.width,out.height);

  $("#main").querySelectorAll("[data-rm]").forEach(x=>x.onchange=()=>{const rt=S.retours[x.dataset.pn];rt.missions=x.checked?[...new Set([...rt.missions,x.dataset.rm])]:rt.missions.filter(m=>m!==x.dataset.rm);save()});
  $("#main").querySelectorAll("[data-rtc]").forEach(el=>el.oninput=()=>{S.retours[el.dataset.pn].conseil=el.value;save()});
  $("#saveProf").onclick=()=>{const p=readProfile();if(!p.prenom){toast("Le prénom est obligatoire.");return}S.profile=Object.assign(S.profile||{},p);save();toast("Profil enregistré.");render()};
  $("#dys").onchange=e=>{S.dys=e.target.checked;document.body.classList.toggle("dys",S.dys);save()};
  $("#classCode").onclick=classCodeModal;$("#restore").onclick=restoreModal;$("#roadmap").onclick=roadmap;
  $("#wipe").onclick=()=>confirmBox("Tout effacer ?","Ton profil, tes entreprises et tes démarches seront supprimés de ce téléphone. Envoie d'abord ton code à ton prof si tu veux le garder.","Tout effacer",()=>{S=blank();save();ui.view="home";render()},true);
}

/* ---------- codes et fichiers ---------- */
function b64u(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function ub64(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pack(prefix,obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));if("CompressionStream" in window){try{const s=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));return prefix+".Z."+b64u(new Uint8Array(await new Response(s).arrayBuffer()))}catch(e){}}return prefix+".J."+b64u(bytes)}
async function unpack(code){const m=String(code).trim().match(/^(PFMP-[A-Z]+)\.([ZJ])\.([A-Za-z0-9_-]+)$/);if(!m)throw new Error("format");let bytes=ub64(m[3]);if(m[2]==="Z"){const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(s).arrayBuffer())}return {kind:m[1],data:JSON.parse(new TextDecoder().decode(bytes))}}
function exportObj(withSig){const o=clone(S);delete o.checklist;delete o.sim;o.sims=S.sim;o.k="eleve";o.v=2;o.exportedAt=Date.now();o.convention=S.conventions[1];o.retour=S.retours[1];o.stats={points:points(),week:weekActions()};if(!withSig)o.companies.forEach(c=>{if(c.proof){c.proof.hasSig=!!c.proof.sig;delete c.proof.sig}delete c.accroche});return o}
async function exportCode(){if(S.example){toast("C'est l'exemple : commence pour de vrai avant d'envoyer ton suivi.");return}const code=await pack("PFMP-ELEVE",exportObj(false));S.lastExport=Date.now();save();
  modal(`<h3>Ton code de suivi</h3><p style="margin:0">Colle ce code dans un message à ton professeur. Il contient tes entreprises et tes démarches.</p><div class="code" id="codeBox">${esc(code)}</div><div class="acts"><button class="btn ghost" data-x>Fermer</button><button class="btn" data-c>Copier le code</button></div>`,close=>{$("#mbox [data-x]").onclick=close;$("#mbox [data-c]").onclick=()=>copy(code,"Code copié : colle-le dans un message à ton prof.")});
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(()=>toast("Code copié : colle-le dans un message à ton prof."),()=>{})}
let dl=null;
async function saveFile(name,data,type){if(dl){try{await dl.save({filename:name,data});toast("Fichier enregistré.");return true}catch(e){if(e&&e.code==="declined")return false}}
  if(!inFrame){try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Fichier téléchargé.");return true}catch(e){}}
  toast("Le téléchargement n'est pas possible ici : utilise « Copier mon code ».");return false}
async function exportFile(){if(S.example){toast("C'est l'exemple : commence pour de vrai avant d'envoyer ton suivi.");return}const p=P();const ok=await saveFile(`pfmp-${norm(p.prenom+" "+(p.nom||"")).replace(/ /g,"-")}-${today()}.json`,JSON.stringify(exportObj(true)),"application/json");if(ok){S.lastExport=Date.now();save();renderMe()}}
function classCodeModal(){modal(`<h3>Code de ma classe</h3><p style="margin:0">Colle le code que ton professeur t'a donné. Il règle tes dates de PFMP, tes objectifs et ajoute les entreprises partenaires du lycée.</p><textarea class="inp" id="ccIn" placeholder="PFMP-CLASSE…" style="font-family:var(--f-mono);font-size:.8rem"></textarea><div class="acts"><button class="btn ghost" data-x>Annuler</button><button class="btn" data-ok>Valider</button></div>`,close=>{
  $("#mbox [data-x]").onclick=close;
  $("#mbox [data-ok]").onclick=async()=>{try{const r=await unpack($("#ccIn").value.replace(/\s+/g,""));if(r.kind!=="PFMP-CLASSE")throw 0;const d=r.data;
    Object.assign(S.config,{classe:d.classe||"",prof:d.prof||"",lycee:d.lycee||"",pfmpStart:d.pfmpStart||"",pfmpEnd:d.pfmpEnd||"",periodes:+d.periodes===2?2:1,pfmp2Start:d.pfmp2Start||"",pfmp2End:d.pfmp2End||"",objectif:+d.objectif||20,hebdo:+d.hebdo||5,partners:Array.isArray(d.partners)?d.partners:[]});if(d.relance)Object.assign(S.config.relance,d.relance);
    if(S.profile){if(d.pfmpStart)S.profile.pfmpStart=d.pfmpStart;if(d.pfmpEnd)S.profile.pfmpEnd=d.pfmpEnd;if(d.pfmp2Start)S.profile.pfmp2Start=d.pfmp2Start;if(d.pfmp2End)S.profile.pfmp2End=d.pfmp2End;if(d.periodes)S.profile.periodes=+d.periodes===2?2:1;if(d.classe&&!S.profile.classe)S.profile.classe=d.classe;if(d.lycee&&!S.profile.lycee)S.profile.lycee=d.lycee;if(d.diplome&&DIPLOMES[d.diplome])S.profile.diplome=d.diplome}
    save();close();toast(`Code accepté : classe ${d.classe||""}, ${S.config.partners.length} entreprise(s) partenaire(s).`);render();
    if(!S.profile){if(d.diplome&&DIPLOMES[d.diplome])$("#p-dip").value=d.diplome;if(d.classe)$("#p-classe").value=d.classe;if(d.lycee)$("#p-lycee").value=d.lycee;if(d.pfmpStart)$("#p-start").value=d.pfmpStart;if(d.pfmpEnd)$("#p-end").value=d.pfmpEnd;if(d.pfmp2Start)$("#p-start2").value=d.pfmp2Start;if(d.pfmp2End)$("#p-end2").value=d.pfmp2End}
  }catch(e){toast("Ce code n'est pas reconnu. Vérifie que tu l'as copié en entier.")}}})}
function restoreModal(){modal(`<h3>Récupérer mon suivi</h3><p style="margin:0">Colle un code de suivi que tu avais copié, ou choisis le fichier téléchargé. Ce que tu as sur ce téléphone sera remplacé.</p><textarea class="inp" id="rsIn" placeholder="PFMP-ELEVE…" style="font-family:var(--f-mono);font-size:.8rem"></textarea><div class="acts"><button class="btn ghost" data-file>Choisir un fichier</button><button class="btn" data-ok>Récupérer</button></div>`,close=>{
  const apply=d=>{if(!d||d.k!=="eleve"||!Array.isArray(d.companies)){toast("Ce n'est pas un suivi Cap PFMP.");return}d.sim=d.sims||{};delete d.sims;delete d.k;delete d.stats;delete d.exportedAt;S=d;fix(S);S.example=false;save();close();ui.view="home";render();toast("Suivi récupéré.")};
  $("#mbox [data-ok]").onclick=async()=>{try{const r=await unpack($("#rsIn").value.replace(/\s+/g,""));if(r.kind!=="PFMP-ELEVE")throw 0;apply(r.data)}catch(e){toast("Ce code n'est pas reconnu.")}};
  $("#mbox [data-file]").onclick=()=>{const fi=$("#fileIn");fi.onchange=()=>{const f=fi.files[0];fi.value="";if(!f)return;const fr=new FileReader();fr.onload=async()=>{const t=String(fr.result).trim();try{if(t.startsWith("PFMP-")){const r=await unpack(t.replace(/\s+/g,""));apply(r.data)}else apply(JSON.parse(t))}catch(e){toast("Fichier illisible.")}};fr.readAsText(f)};fi.click()}})}
function roadmap(){const p=P(),{start,end}=per(1),p2=per(2);
  const rows=S.companies.map(c=>{const last=c.events[c.events.length-1];return `<tr><td>${esc(c.nom)}<br><small>${esc(c.ville||"")}${nP()===2?" · période "+cPer(c):""}</small></td><td>${last?fd(last.date):""}</td><td>${esc(STATUS[cStatus(c)])}</td><td style="height:64px"></td></tr>`}).join("")+Array(Math.max(0,8-S.companies.length)).fill('<tr><td style="height:64px"></td><td></td><td></td><td></td></tr>').join("");
  const html=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Feuille de route PFMP</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#111}h1{font-size:20px;margin:0 0 4px}p{margin:2px 0}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border:1px solid #444;padding:6px;font-size:13px;vertical-align:top;text-align:left}th{background:#eee}small{color:#555}@media print{button{display:none}}</style></head><body><button onclick="window.print()" style="float:right;padding:8px 14px">Imprimer</button><h1>Feuille de route · recherche de PFMP</h1><p><b>${esc((p.prenom+" "+(p.nom||"")).trim())}</b> · ${esc(p.classe||"")} · ${esc(p.lycee||"")}</p><p>${esc(D().long)}${start?` · PFMP${nP()===2?" 1":""} du ${fdl(start)} au ${fdl(end)}`:""}${nP()===2&&p2.start?` · PFMP 2 du ${fdl(p2.start)} au ${fdl(p2.end)}`:""}</p><p style="margin-top:8px"><small>Madame, Monsieur, merci d'indiquer votre réponse et d'apposer votre signature ou le cachet de l'entreprise. Ce document atteste des démarches de l'élève.</small></p><table><thead><tr><th style="width:30%">Entreprise</th><th style="width:14%">Date</th><th style="width:18%">Réponse</th><th>Signature ou cachet</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
  if(!inFrame){const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();return}}
  saveFile(`feuille-de-route-pfmp-${norm(p.prenom).replace(/ /g,"-")}.html`,html,"text/html").then(ok=>{if(ok)toast("Ouvre le fichier puis imprime-le, ou envoie-le à ton prof.")})}
